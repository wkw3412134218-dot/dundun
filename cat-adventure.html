<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>敦敦的三站冒险</title>
  <style>
    :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#3d2a35}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff5df;display:grid;place-items:center;padding:18px}.game{width:min(900px,100%);background:#fffdf8;border:4px solid #55384b;border-radius:28px;box-shadow:0 12px 0 #e3b76d,0 20px 40px #8a5d3c44;overflow:hidden}.top{padding:20px 24px 14px;background:linear-gradient(120deg,#ffd66f,#ff9f6a);color:#513344}.top h1{font-size:clamp(25px,5vw,39px);margin:0;text-align:center}.top p{text-align:center;margin:7px 0 0}.levels{display:flex;gap:9px;justify-content:center;margin-top:15px}.level{min-width:120px;border:2px solid #563847;border-radius:14px;padding:8px;background:#fff2cf;font:inherit;font-weight:800;color:#563847}.level.active{background:#563847;color:#fff}.level:disabled{opacity:.45;cursor:not-allowed}.main{min-height:435px;padding:24px;position:relative}.scene{text-align:center}.scene h2{margin:0 0 8px;font-size:26px}.scene p{margin:0 0 16px;color:#775b68}.task{min-height:235px;border:3px dashed #deb870;border-radius:20px;background:#fff8e9;padding:16px;position:relative;overflow:hidden}.counter{font-weight:800;color:#c44b4d;font-size:18px}.catch-area{height:175px;position:relative}.fish{position:absolute;border:0;background:transparent;font-size:46px;cursor:pointer;filter:drop-shadow(0 3px 1px #ab805833);animation:wiggle .75s ease-in-out infinite alternate}.fish:hover{transform:scale(1.15)}@keyframes wiggle{to{rotate:11deg}}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding-top:28px}.choice{border:3px solid #785664;border-radius:17px;background:#fff;color:#4e3440;padding:17px 21px;font:800 18px system-ui;cursor:pointer;box-shadow:0 4px 0 #caa18a}.choice:hover{translate:0 -2px}.choice.good{background:#bfe7b3}.choice.bad{animation:shake .25s 2;background:#ffd0cb}@keyframes shake{50%{translate:8px 0}}.code{display:flex;gap:10px;justify-content:center;font-size:34px;margin:16px}.code span{width:54px;height:60px;display:grid;place-items:center;background:#f7e5be;border-radius:13px;border:3px solid #c69c61}.clue{font-weight:800;color:#34546b}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:16px;align-items:center}.tip{font-size:14px;color:#826475}.reset{border:0;border-radius:10px;padding:9px 14px;background:#775261;color:#fff;font:inherit;cursor:pointer}.modal{position:fixed;inset:0;background:#251724aa;display:none;place-items:center;padding:20px;z-index:5}.modal.show{display:grid}.card{max-width:720px;width:100%;background:#fffdf8;border-radius:24px;padding:20px;text-align:center;box-shadow:0 12px 50px #0008}.card h2{margin:0 0 9px;color:#a64b50}.reward{max-height:51vh;width:100%;object-fit:contain;border-radius:16px;border:3px solid #f1c774;background:#fff}.next{border:0;border-radius:13px;background:#d85d5b;color:white;padding:12px 23px;margin-top:14px;font:800 17px system-ui;cursor:pointer}.sparkles{font-size:25px;letter-spacing:.25em}.final{font-size:20px;color:#315b62;font-weight:800}@media(max-width:540px){.main{padding:16px}.level{min-width:0;font-size:13px}.task{padding:10px}.choice{padding:13px}.top{padding-inline:12px}}
  </style>
</head>
<body><main class="game"><header class="top"><h1>🐾 敦敦的三站冒险</h1><p>完成每一站任务，解锁一张猫咪纪念图！</p><nav class="levels"><button class="level active" data-level="1">第一关 · 花园</button><button class="level" data-level="2" disabled>🔒 第二关 · 学校</button><button class="level" data-level="3" disabled>🔒 第三关 · 警察局</button></nav></header><section class="main" id="main"></section></main>
<div class="modal" id="modal"><div class="card"><div class="sparkles">✨ 🐾 ✨</div><h2 id="rewardTitle">奖励解锁！</h2><p id="rewardText"></p><img class="reward" id="rewardImg" alt="解锁的猫咪奖励图"><p class="final" id="finalText"></p><button class="next" id="next">下一关</button></div></div>
<script>
  const main=document.querySelector('#main'), buttons=[...document.querySelectorAll('.level')], modal=document.querySelector('#modal'), rewardImg=document.querySelector('#rewardImg'), rewardTitle=document.querySelector('#rewardTitle'), rewardText=document.querySelector('#rewardText'), finalText=document.querySelector('#finalText'), next=document.querySelector('#next');
  let unlocked=1, current=1, progress=0; const rewards=['cat-reward-1.png','cat-reward-2-school.png','cat-reward-3-police.png'];
  const content={
    1:{title:'第一关：花园寻鱼',desc:'帮敦敦找到 6 条藏在花园里的小鱼。',tip:'点击每条小鱼。'},
    2:{title:'第二关：学校小测验',desc:'敦敦要去上学啦！从答案中选出正确的学习用品。',tip:'答对 3 题即可过关。'},
    3:{title:'第三关：警察局线索',desc:'小猫警员要破解线索！按顺序点击：警徽 → 钥匙 → 放大镜。',tip:'点错会重新开始线索。'}
  };
  function render(){buttons.forEach((b,i)=>{b.disabled=i+1>unlocked;b.classList.toggle('active',i+1===current);b.textContent=(i+1>unlocked?'🔒 ':'')+['第一关 · 花园','第二关 · 学校','第三关 · 警察局'][i]});let c=content[current];main.innerHTML=`<div class="scene"><h2>${c.title}</h2><p>${c.desc}</p><div class="task" id="task"></div><div class="footer"><span class="tip">💡 ${c.tip}</span><button class="reset" id="reset">重新开始本关</button></div></div>`;document.querySelector('#reset').onclick=render;if(current===1)garden();if(current===2)school();if(current===3)police();}
  function garden(){let found=0,task=document.querySelector('#task');task.innerHTML=`<div class="counter">找到小鱼：<span id="count">0</span> / 6</div><div class="catch-area" id="catch"></div>`;let area=document.querySelector('#catch');for(let i=0;i<6;i++){let f=document.createElement('button');f.className='fish';f.textContent='🐟';f.style.left=(4+Math.random()*82)+'%';f.style.top=(8+Math.random()*60)+'%';f.onclick=()=>{f.remove();document.querySelector('#count').textContent=++found;if(found===6)complete()};area.append(f)}}
  function school(){let task=document.querySelector('#task'),question=0,score=0,qs=[['上课要带什么？',['📚 课本','🍳 平底锅','🎸 吉他'],0],['写作业要用什么？',['🛏️ 枕头','✏️ 铅笔','⚽ 足球'],1],['学校里用来学习的地方？',['📖 图书馆','🚗 车库','🏊 游泳池'],0]];function ask(){let q=qs[question];task.innerHTML=`<div class="counter">答对：${score} / 3</div><h3>${q[0]}</h3><div class="choices">${q[1].map((x,i)=>`<button class="choice" data-i="${i}">${x}</button>`).join('')}</div>`;task.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let ok=+b.dataset.i===q[2];b.classList.add(ok?'good':'bad');if(ok)score++;setTimeout(()=>{question++;question===qs.length?(score===3?complete():school()):ask()},450)})}ask()}
  function police(){let task=document.querySelector('#task'),expected=0,sequence=['🛡️','🔑','🔎'];task.innerHTML=`<div class="counter">案件线索</div><p class="clue">依次收集：警徽 → 钥匙 → 放大镜</p><div class="code" id="code"><span>？</span><span>？</span><span>？</span></div><div class="choices">${['🔑','🛡️','🔎','🍩'].map(x=>`<button class="choice">${x}</button>`).join('')}</div>`;task.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.textContent===sequence[expected]){document.querySelectorAll('#code span')[expected].textContent=b.textContent;expected++;if(expected===3)complete()}else{expected=0;document.querySelectorAll('#code span').forEach(x=>x.textContent='？');b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),500)}})}
  function complete(){unlocked=Math.max(unlocked,current+1);rewardImg.src=rewards[current-1];rewardTitle.textContent=`第 ${current} 关完成！奖励解锁`;rewardText.textContent=['悠闲花园敦敦','小学生敦敦','小警员敦敦'][current-1];finalText.textContent=current===3?'恭喜你完成三站冒险，敦敦为你鼓掌！':'';next.textContent=current===3?'重新游玩':'前往下一关';modal.classList.add('show')}
  next.onclick=()=>{modal.classList.remove('show');if(current===3){current=1;unlocked=1}else current++;render()};buttons.forEach(b=>b.onclick=()=>{current=+b.dataset.level;render()});render();
</script></body></html>
